name = "kekal-frontend"
compatibility_date = "2024-09-23"

# Cloudflare Pages configuration
pages_build_output_dir = "./dist"

[vars]
# URL of the Kekal backend API (Cloudflare Worker)
VITE_API_URL="https://kekal-backend-production.kekal.workers.dev"

# Cloudinary cloud name for media uploads
VITE_CLOUDINARY_CLOUD_NAME="ytqenkxa"


[env.production]
# Production environment variables are set in the Cloudflare Pages dashboard

[env.preview]
# Preview environment variables are set in the Cloudflare Pages dashboard
